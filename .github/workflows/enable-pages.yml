name: Publikuj na GitHub Pages

# Wymaga jednorazowego ustawienia w repo:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Token workflow nie ma uprawnien admina, wiec nie moze wlaczyc Pages sam.

on:
  push:
    branches:
      - main
      - claude/free-subdomain-deployment-n00vxc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Zloz katalog do publikacji
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll
          ls -la _site

      - name: Konfiguruj Pages
        uses: actions/configure-pages@v5

      - name: Spakuj strone
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wdroz
        id: deployment
        uses: actions/deploy-pages@v4
