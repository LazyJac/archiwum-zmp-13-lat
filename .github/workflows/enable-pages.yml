name: Wlacz GitHub Pages

# Jednorazowy workflow: wlacza serwowanie strony z galezi main (katalog glowny).
# Po wlaczeniu Pages kazdy push do main publikuje sie automatycznie.
on:
  push:
    branches:
      - claude/free-subdomain-deployment-n00vxc

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Wlacz Pages (zrodlo: main, katalog /)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api() {
            curl -sS -o /tmp/resp.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }

          code=$(api -X POST "https://api.github.com/repos/$REPO/pages" \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "POST /pages -> $code"
          cat /tmp/resp.json; echo

          if [ "$code" = "409" ]; then
            echo "Pages juz istnieje, aktualizuje zrodlo."
            code=$(api -X PUT "https://api.github.com/repos/$REPO/pages" \
              -d '{"source":{"branch":"main","path":"/"}}')
            echo "PUT /pages -> $code"
            cat /tmp/resp.json; echo
          fi

          case "$code" in
            201|204) ;;
            *) echo "Nie udalo sie wlaczyc Pages (HTTP $code)."; exit 1 ;;
          esac

      - name: Wymus build i pokaz status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages/builds" > /dev/null || true

          for i in $(seq 1 20); do
            body=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pages")
            status=$(printf '%s' "$body" | jq -r '.status // "null"')
            url=$(printf '%s' "$body" | jq -r '.html_url // "null"')
            echo "proba $i: status=$status url=$url"
            if [ "$status" = "built" ]; then
              echo "STRONA ZYJE: $url"
              echo "### Strona opublikowana: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done

          echo "Pages wlaczone, ale build jeszcze sie nie zakonczyl. Sprawdz za chwile."
          echo "### Pages wlaczone, build w toku" >> "$GITHUB_STEP_SUMMARY"
